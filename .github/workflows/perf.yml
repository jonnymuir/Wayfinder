name: Performance

# k6 load run (tests/perf/smoke.js) against a booted Wayfinder.ReferenceApp. Read paths only:
# the applicant journey pages and the caseworker worklist, each behind the demo login. Thresholds
# in the script fail the job on >1% errors or a p95 regression. Nightly and on demand rather than
# per PR: it boots the reference app and holds load for about 70s, and the runner's absolute
# numbers are noisy, so this is a tripwire for order-of-magnitude regressions, not a benchmark.
# Not a required check.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'smoke (default) or stress'
        default: smoke
        type: choice
        options: [smoke, stress]

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Editor.Client/package-lock.json

      - name: Build editor client bundle
        working-directory: Wayfinder.Editor.Client
        run: npm ci && npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Boot the reference app
        run: |
          dotnet run -c Release --project Wayfinder.ReferenceApp --urls http://127.0.0.1:8080 > app.log 2>&1 &
          for _ in $(seq 1 140); do
            curl -sf -o /dev/null http://127.0.0.1:8080/account/login && exit 0
            sleep 3
          done
          cat app.log
          exit 1

      - name: Run k6
        env:
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: k6 run -e BASE_URL=http://127.0.0.1:8080 -e PROFILE="$PROFILE" --summary-export=k6-summary.json tests/perf/smoke.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: k6-summary.json
