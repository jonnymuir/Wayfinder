name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Editor.Client/package-lock.json

      # Wayfinder.Editor packs the compiled service-blueprint-editor bundle as a static
      # web asset (wwwroot/dist), so that bundle must exist on disk before dotnet build/pack
      # run against it.
      - name: Install editor client dependencies
        working-directory: Wayfinder.Editor.Client
        run: npm ci

      - name: Build editor client bundle
        working-directory: Wayfinder.Editor.Client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Wayfinder.slnx

      - name: Build
        run: dotnet build Wayfinder.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wayfinder.slnx -c Release --no-build

      # The editor's TypeScript model is generated from the C# model; a stale file means the two
      # have drifted. Fix with: dotnet run --project Wayfinder.TypeGen -- write <path>
      - name: Editor TypeScript model is current
        run: dotnet run --project Wayfinder.TypeGen --no-build -c Release -- check Wayfinder.Editor.Client/src/service-blueprint-editor/generated/wayfinder-model.ts

      # Size and complexity budgets (CLAUDE.md, "Keep things small"). Growth past a budget or baseline fails;
      # a stale baseline entry fails too, so the lists only ever shrink.
      - name: Size and complexity policies
        run: node scripts/check-policies.mjs

      - name: Complexity baselines are tight
        run: node scripts/check-policies.mjs --stale

      # Proves the JS calculation evaluator (Wayfinder.Rendering.GovUk/wwwroot/js/wayfinder-
      # calculations.js) stays behaviourally identical to the C# one just tested above — both
      # run the same shared fixture file. Plain Node, no npm install needed for this one script.
      - name: JS calculation engine conformance
        run: node Wayfinder.Rendering.GovUk/test/wayfinder-calculations.conformance.mjs

      # Foreground/resume handling for the waiting stage's poll script — the part a real browser
      # can't easily exercise in CI (no Capacitor bridge, no way to simulate mobile backgrounding).
      - name: JS poll script behaviour
        run: node Wayfinder.Rendering.GovUk/test/wayfinder-poll.behaviour.mjs

      # Validates packing still succeeds on every push — the real publish only happens from
      # package-release.yml on a version tag, straight to nuget.org (Trusted Publishing). No
      # GitHub Packages feed: nuget.org is the only publish target.
      - name: Pack
        run: dotnet pack Wayfinder.slnx -c Release --no-build -o ./artifacts

  editor-client-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Editor.Client/package-lock.json

      - name: Install dependencies
        working-directory: Wayfinder.Editor.Client
        run: npm ci

      - name: TypeScript build check
        working-directory: Wayfinder.Editor.Client
        run: npm run build

      - name: Graph layout tests
        working-directory: Wayfinder.Editor.Client
        run: npm run test:graph-layout

      - name: Component schema/lint tests
        working-directory: Wayfinder.Editor.Client
        run: npm run test:component-schema

      - name: Validation rail tests (server diagnostic mapping + in-browser fallback)
        working-directory: Wayfinder.Editor.Client
        run: npm run test:server-diagnostic-location && npm run test:service-blueprint-validation

      - name: Canonical JSON round-trip, property references and calculation tests
        working-directory: Wayfinder.Editor.Client
        run: >-
          npm run test:canonical-json &&
          npm run test:property-references &&
          npm run test:calculation-runtime &&
          npm run test:calculation-ordering &&
          npm run test:calculation-diagnostics

      # Biome: lint + format in one tool. `npm run format` fixes formatting; lint findings are fixed or
      # suppressed with a written reason (`// biome-ignore rule: reason`).
      - name: Lint and format
        working-directory: Wayfinder.Editor.Client
        run: npm run lint

      - name: Editor unit tests
        working-directory: Wayfinder.Editor.Client
        run: npm run test:units

      - name: No legacy blueprint shapes
        working-directory: Wayfinder.Editor.Client
        run: npm run test:no-legacy-shapes

      # CodeQL cannot see this class here (fetch responses are not modelled as untrusted, and an
      # escape helper that round-trips through the DOM hides the data flow): see the script's header.
      - name: No unmarked HTML sinks built from data
        working-directory: Wayfinder.Editor.Client
        run: npm run test:no-unsafe-html-sinks

      - name: Install Playwright browsers
        working-directory: Wayfinder.Editor.Client
        run: npx playwright install --with-deps

      # A real browser is needed: the bug it guards against (attribute injection through an
      # uploaded dataset's cell values) lives in the browser's own HTML parsing.
      - name: Bulk-data review escaping (real browser)
        run: node Wayfinder.Rendering.GovUk/test/wayfinder-bulk-data-review.xss.mjs

      - name: Storybook interaction/a11y tests
        working-directory: Wayfinder.Editor.Client
        run: npm run test-storybook

      # The whole Playwright suite (canvas drag, arrow endpoints, undo/redo, definition-tab sync,
      # graph visual regression) against the Storybook the config boots. Specs wait on state, not
      # fixed sleeps, so this is deterministic; a failure here is a real regression.
      - name: Service blueprint editor Playwright suite
        working-directory: Wayfinder.Editor.Client
        run: npm run test:playwright -- --reporter=line

  # Single aggregate check so branch protection only needs to name one required status
  # check ("all") instead of every job individually — same pattern as Umbraco.Prism's
  # squad-ci.yml. Add new jobs above to the `needs` list here to keep them gating merges.
  # The reference app's own end-to-end journeys (citizen apply, caseworker queue and worklist, editor,
  # file upload, accessibility, hostile input). They boot Wayfinder.ReferenceApp themselves via the
  # config's webServer. The live-config specs (Aspire, a second app) stay a local-only suite.
  reference-app-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Wayfinder.Editor.Client/package-lock.json
            Wayfinder.ReferenceApp.Tests/package-lock.json

      # The reference app serves Wayfinder.Editor's compiled bundle as a static web asset, so it must
      # exist on disk before the app boots.
      - name: Build editor client bundle
        working-directory: Wayfinder.Editor.Client
        run: npm ci && npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install test dependencies
        working-directory: Wayfinder.ReferenceApp.Tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Wayfinder.ReferenceApp.Tests
        run: npx playwright install --with-deps chromium

      - name: Reference app end-to-end tests
        working-directory: Wayfinder.ReferenceApp.Tests
        run: npx playwright test --reporter=line

  all:
    runs-on: ubuntu-latest
    needs: [build-and-pack, editor-client-tests, reference-app-e2e]
    if: always()
    permissions: {}
    steps:
      - name: Decide whether checks have passed
        run: |
          if [[ "${{ needs.build-and-pack.result }}" == "success" && "${{ needs.editor-client-tests.result }}" == "success" && "${{ needs.reference-app-e2e.result }}" == "success" ]]; then
            echo "All checks passed"
            exit 0
          else
            echo "Some checks failed"
            exit 1
          fi
