name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wayfinder.slnx

      - name: Build
        run: dotnet build Wayfinder.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack Wayfinder.slnx -c Release --no-build -o ./artifacts
