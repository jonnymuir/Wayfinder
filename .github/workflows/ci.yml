name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Editor.Client/package-lock.json

      # Wayfinder.Editor packs the compiled service-blueprint-editor bundle as a static
      # web asset (wwwroot/dist), so that bundle must exist on disk before dotnet build/pack
      # run against it.
      - name: Install editor client dependencies
        working-directory: Wayfinder.Editor.Client
        run: npm ci

      - name: Build editor client bundle
        working-directory: Wayfinder.Editor.Client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wayfinder.slnx

      - name: Build
        run: dotnet build Wayfinder.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wayfinder.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Wayfinder.slnx -c Release --no-build -o ./artifacts

      # Publishes on every push to main using the workflow's own auto-provisioned token —
      # no PAT needed for this repo to publish its own packages. Consuming these packages
      # from a different repo's CI (e.g. Wayfinder.Umbraco) does need a PAT with
      # read:packages, since a repo's automatic GITHUB_TOKEN doesn't read another repo's
      # packages under a personal account.
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/jonnymuir/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  editor-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Editor.Client/package-lock.json

      - name: Install dependencies
        working-directory: Wayfinder.Editor.Client
        run: npm ci

      - name: TypeScript build check
        working-directory: Wayfinder.Editor.Client
        run: npm run build

      - name: Graph layout tests
        working-directory: Wayfinder.Editor.Client
        run: npm run test:graph-layout

      - name: Install Playwright browsers
        working-directory: Wayfinder.Editor.Client
        run: npx playwright install --with-deps

      - name: Storybook interaction/a11y tests
        working-directory: Wayfinder.Editor.Client
        run: npm run test-storybook:ci:all

      # The rest of tests/service-blueprint-editor/ (canvas drag, pixel-perfect arrow
      # endpoints, undo/redo timing) is pixel- and timing-sensitive and isn't part of
      # Umbraco.Prism's own CI gate for the same code either — kept as a local/manual
      # regression suite, not a CI gate.
      - name: Service blueprint graph visual regression
        working-directory: Wayfinder.Editor.Client
        run: npm run test:playwright:service-blueprint-graph-visual
