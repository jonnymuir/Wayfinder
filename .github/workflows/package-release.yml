name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for NuGet Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@v4

      - name: Verify package versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          for PROJECT in Wayfinder Wayfinder.Engine Wayfinder.Engine.Api Wayfinder.Engine.Mcp; do
            VERSION=$(grep -oE '<Version>[^<]+</Version>' "$PROJECT/$PROJECT.csproj" | head -1 | sed -E 's#</?Version>##g')
            echo "$PROJECT.csproj version: $VERSION"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag ${TAG} does not match $PROJECT.csproj <Version>${VERSION}</Version>. All four packages are released in lockstep — bump every csproj before tagging, since a mismatch would silently try to re-push an already-published version to NuGet."
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wayfinder.slnx

      - name: Build
        run: dotnet build Wayfinder.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wayfinder.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Wayfinder.slnx -c Release --no-build -o artifacts

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wayfinder-nuget
          path: artifacts/*.nupkg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*.nupkg

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a NuGet.org API key
      # that's minted fresh and expires in an hour — no long-lived secret stored anywhere.
      # Requires a Trusted Publishing policy on nuget.org scoped to this exact repo +
      # workflow file (jonnymuir/Wayfinder, package-release.yml).
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate

  npm-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm Trusted Publishing (OIDC token exchange)
    defaults:
      run:
        working-directory: Wayfinder.Editor.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Editor.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      # @wayfinder/editor-client isn't in the lockstep tag-version-match gate the .NET
      # packages use (like Wayfinder.Editor's own .csproj, its version is bumped
      # independently) — skip the publish step entirely if this version is already on
      # the registry, since npm has no --skip-duplicate equivalent to dotnet nuget push.
      - name: Check whether this version is already published
        id: check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@wayfinder/editor-client@$PKG_VERSION" version 2>/dev/null; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a short-lived npm
      # publish token — no long-lived NPM_TOKEN secret stored anywhere. Requires a Trusted
      # Publisher configured on the @wayfinder/editor-client package on npmjs.com, scoped
      # to this exact repo + workflow file (jonnymuir/Wayfinder, package-release.yml), and
      # npm CLI >= 11.5.1 (bundled with Node 22).
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && steps.check.outputs.already-published == 'false'
        run: npm publish
