name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for NuGet Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@v4

      - name: Verify package versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          for PROJECT in Wayfinder Wayfinder.Engine Wayfinder.Engine.Api Wayfinder.Engine.Mcp; do
            VERSION=$(grep -oE '<Version>[^<]+</Version>' "$PROJECT/$PROJECT.csproj" | head -1 | sed -E 's#</?Version>##g')
            echo "$PROJECT.csproj version: $VERSION"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag ${TAG} does not match $PROJECT.csproj <Version>${VERSION}</Version>. All four packages are released in lockstep — bump every csproj before tagging, since a mismatch would silently try to re-push an already-published version to NuGet."
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Editor.Client/package-lock.json

      # Wayfinder.Editor packs its compiled service-blueprint-editor/wayfinder-elements bundles
      # as static web assets (wwwroot/dist), so they must exist on disk before dotnet pack runs
      # — ci.yml's build-and-pack job already does this before its own (GitHub Packages) pack
      # step; this release workflow packs+pushes to nuget.org independently and needs the same
      # build first, or it silently ships an empty package (confirmed live: v0.1.3 did exactly
      # that — 0.1.0 on nuget.org has no wwwroot/dist content and no static-web-asset props at
      # all, only the bare DLL).
      - name: Install editor client dependencies
        working-directory: Wayfinder.Editor.Client
        run: npm ci

      - name: Build editor client bundles
        working-directory: Wayfinder.Editor.Client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wayfinder.slnx

      - name: Build
        run: dotnet build Wayfinder.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wayfinder.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Wayfinder.slnx -c Release --no-build -o artifacts

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wayfinder-nuget
          path: artifacts/*.nupkg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*.nupkg

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a NuGet.org API key
      # that's minted fresh and expires in an hour — no long-lived secret stored anywhere.
      # Requires a Trusted Publishing policy on nuget.org scoped to this exact repo +
      # workflow file (jonnymuir/Wayfinder, package-release.yml).
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
