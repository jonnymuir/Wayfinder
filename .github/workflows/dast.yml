name: DAST

# Dynamic scan — OWASP ZAP baseline (passive rules only, non-destructive) against a
# running Wayfinder.ReferenceApp. Implementation lives in jonnymuir/ci-security so the
# same scan runs identically across the estate. Catches runtime issues SAST can't:
# missing/mis-set security headers, cookie flags, cache-control, info disclosure.
#
# Separate from security.yml because it boots an app (different execution model).
#
# Posture: BLOCKING for the unauthenticated leg (`baseline`) — every finding from the first
# scan is triaged in .zap/rules.tsv (accepted ones marked IGNORE), so `fail-action: true` and
# the `baseline / DAST baseline` check-run is required in the branch ruleset. A new
# un-IGNOREd finding fails. Re-triage .zap/rules.tsv when a later phase widens the scan.
#
# The `authenticated-baseline` leg (Phase 3c) is ADVISORY for now (`fail-action: false`) —
# same "advisory then required" rollout the unauthenticated leg itself followed. It scans as
# a signed-in caseworker via cookie replay (see ci-security's login-command), reaching pages
# the unauthenticated spider never finds (the worklist, bulk-data review, ...). Flip it to
# blocking and add its check-run to the ruleset once its own first-run findings are triaged.
#
# Runs on every pull_request (so the required check reports pre-merge, like CodeQL/zizmor),
# on push to main, nightly, and on demand.
#
# Phase 3a: unauthenticated scan of the reference app in the Development environment.
# Phase 3c: the authenticated leg below. Later phases add a Production-env leg and the
# Umbraco hosts (Wayfinder.Umbraco has its own dast.yml, mirroring this one).

on:
  pull_request:
  schedule:
    - cron: '0 4 * * *'   # nightly 04:00 UTC (SAST runs Mondays 03:00)
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  baseline:
    # SHA-pinned (zizmor blanket policy); Dependabot's github-actions ecosystem keeps
    # this current, so ci-security changes arrive as a reviewed bump.
    uses: jonnymuir/ci-security/.github/workflows/dast-baseline.yml@2f3bd71dbd7de04d80d6bd50cb4a8727e0730967 # v1
    permissions:
      contents: read
    with:
      boot-command: dotnet run --project Wayfinder.ReferenceApp --urls http://127.0.0.1:8080
      target-url: http://127.0.0.1:8080
      health-path: /account/login
      # Wayfinder.Editor packs Wayfinder.Editor.Client's dist as a static web asset the
      # host serves — it must exist before the reference app boots.
      node-build: '["Wayfinder.Editor.Client"]'
      # rules-file-path defaults to .zap/rules.tsv
      fail-action: true

  authenticated-baseline:
    uses: jonnymuir/ci-security/.github/workflows/dast-baseline.yml@2f3bd71dbd7de04d80d6bd50cb4a8727e0730967 # v1
    permissions:
      contents: read
    with:
      boot-command: dotnet run --project Wayfinder.ReferenceApp --urls http://127.0.0.1:8080
      target-url: http://127.0.0.1:8080
      health-path: /account/login
      node-build: '["Wayfinder.Editor.Client"]'
      # Signs in as the demo caseworker persona (the broader of the two demo roles) via the
      # reference app's own /account/login POST — see Wayfinder.ReferenceApp/Services/
      # DemoUsers.cs. Cookie replay, not a ZAP-scripted login (see ci-security's own
      # login-command doc): a baseline scan is passive-only, so no active-auth mechanism
      # is needed.
      login-command: |
        set -euo pipefail
        jar="$RUNNER_TEMP/zap-login-jar.txt"
        curl -sS -c "$jar" -o /dev/null http://127.0.0.1:8080/account/login
        curl -sS -c "$jar" -b "$jar" -o /dev/null -L \
          --data-urlencode "email=caseworker@example.test" \
          --data-urlencode "password=wayfinder-demo" \
          http://127.0.0.1:8080/account/login
        # curl's Netscape jar prefixes an HttpOnly cookie's line with "#HttpOnly_" on the
        # domain field — ASP.NET Core's own cookie-auth cookie is HttpOnly by default, so a
        # naive "skip lines starting with #" filter silently drops exactly the cookie this
        # needs. Strip that prefix first, then the normal comment/field filter applies.
        awk -F'\t' '/^#HttpOnly_/ { sub(/^#HttpOnly_/, ""); } !/^#/ && NF==7 { printf "%s=%s; ", $6, $7 }' "$jar" | sed 's/; $//' > "$RUNNER_TEMP/zap-auth-cookie.txt"
      # Advisory until this leg's own first-run findings are triaged into .zap/rules.tsv —
      # see this file's own header comment.
      fail-action: false
      artifact-name: zap-authenticated-baseline-report
