# Dependabot version updates. Security updates (the ones that open PRs for a known CVE)
# are enabled separately in repo settings and don't need an entry here — this file is
# only the routine "keep dependencies current" schedule.
#
# Everything is weekly and grouped so a quiet week produces at most one PR per ecosystem
# rather than a dozen. nuget.org is the only feed (see NuGet.config); there is no GitHub
# Packages source to configure.
#
# `cooldown` holds a newly published version back for 7 days before Dependabot will
# propose it, so a poisoned release has a window to be spotted and yanked before it
# reaches a PR here (supply-chain hardening; flagged by zizmor's dependabot-cooldown).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # AwesomeAssertions is intentionally held at 7.x — the community fork of FluentAssertions
      # 7.2.0 that keeps the FluentAssertions namespace/assembly name, so it is a drop-in with
      # zero test edits. 8.x / 9.x rename to the AwesomeAssertions namespace (touching every test
      # file for no functional gain). Bump only as a deliberate namespace migration.
      - dependency-name: "AwesomeAssertions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Three independent npm projects, each with its own lockfile.
  - package-ecosystem: npm
    directory: "/Wayfinder.Editor.Client"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      editor-client:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/Wayfinder.Rendering.GovUk"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      rendering-govuk:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/Wayfinder.ReferenceApp.Tests"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      referenceapp-tests:
        patterns: ["*"]
        update-types: ["minor", "patch"]
